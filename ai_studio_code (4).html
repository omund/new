<!-- Similar to login.html, just change the form fields inside .form-box -->
<div class="form-box">
    <h2>Create Account</h2>
    <form>
        <div class="input-group"><i class="fas fa-user"></i><input type="text" placeholder="Full Name" required></div>
        <div class="input-group"><i class="fas fa-envelope"></i><input type="email" placeholder="Email Address" required></div>
        <div class="input-group"><i class="fas fa-phone"></i><input type="tel" placeholder="Mobile Number" required></div>
        <div class="input-group"><i class="fas fa-lock"></i><input type="password" placeholder="Password" required></div>
        <button type="submit" class="btn-search" style="width: 100%;">Register</button>
    </form>
    <div class="form-footer">
        <p>Already have an account? <a href="login.html">Login here</a></p>
    </div>
</div>
