<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TravelEdge</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navbar (Simplified for auth pages) -->
    <nav class="navbar">
        <div class="container nav-container">
            <div class="logo"><a href="index.html">Travel<span>Edge</span></a></div>
        </div>
    </nav>

    <section class="form-section">
        <div class="form-box">
            <h2>Welcome Back</h2>
            <form>
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" placeholder="Email Address" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" placeholder="Password" required>
                </div>
                <!-- This button will eventually connect to PHP login script -->
                <button type="submit" class="btn-search" style="width: 100%;">Login</button>
            </form>
            <div class="form-footer">
                <p>Don't have an account? <a href="register.html">Register here</a></p>
                <p style="margin-top: 10px;"><a href="#">Forgot Password?</a></p>
            </div>
        </div>
    </section>
</body>
</html>
